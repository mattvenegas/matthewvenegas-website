<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../Icons/Icon_White.png">
    <style>
        #live-clock-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            cursor: none;
        }
        #live-clock {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #ffffff;
            border-style: solid;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .corner-tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
        .corner-tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

        #live-clock-wrapper:hover .corner {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body class="home-page">
    <header>
        <a href="./" class="logo-link"></a>
        <nav>
            <a href="about/">About</a>
            <a href="works/">Works</a>
            <a href="contact/">Contact</a>
        </nav>
    </header>

    <div class="content">
        <img src="Loading.gif" alt="Loading">
        <p>IN PROGRESS</p>
    </div>

    <div id="live-clock-wrapper">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div id="live-clock"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
            document.getElementById('live-clock').textContent = new Intl.DateTimeFormat([], options).format(now);
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
