<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" href="../Icons/Icon_White.png">
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <style>
        body, *, header, nav a, p, #live-clock {
            font-family: 'Courier Prime', monospace !important;
        }
        #live-clock-wrapper {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            cursor: none;
        }
        #live-clock {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffffff;
        }
        .corner {
            position: absolute;
            width: 8px;
            height: 8px;
            border-color: #ffffff;
            border-style: solid;
            opacity: 0;
            transform: scale(0.5);
        }
        .corner-tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
        .corner-tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }
    </style>
</head>
<body class="home-page">
    <header>
        <a href="./" class="logo-link"></a>
        <nav>
            <a href="about/">About</a>
            <a href="works/">Works</a>
            <a href="contact/">Contact</a>
        </nav>
    </header>

    <div id="live-clock-wrapper">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>
        <div id="live-clock"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { hour: '2-digit', minute: '2-digit', second: '2-digit', timeZoneName: 'short' };
            document.getElementById('live-clock').textContent = new Intl.DateTimeFormat([], options).format(now);
        }
        setInterval(updateClock, 1000);
        updateClock();

        const wrapper = document.getElementById('live-clock-wrapper');
        const corners = wrapper.querySelectorAll('.corner');

        wrapper.addEventListener('mouseenter', () => {
            anime({
                targets: corners,
                opacity: 1,
                scale: 1,
                duration: 300,
                easing: 'easeOutExpo',
                delay: anime.stagger(40)
            });
        });

        wrapper.addEventListener('mouseleave', () => {
            anime({
                targets: corners,
                opacity: 0,
                scale: 0.5,
                duration: 200,
                easing: 'easeInExpo'
            });
        });
    </script>
</body>
</html>
